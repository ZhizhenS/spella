name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  english:
    name: Dictionaries and English engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The embedded catalogs must reproduce byte for byte from their frozen sources.
      - name: Dictionary producers
        run: |
          python tools/english-assist/test-modern-entities.py
          python tools/english-assist/modern-entities.py --check
          python tools/english-assist/test-build-modern-lexicon.py
          python tools/english-assist/build-modern-lexicon.py --check
          python tools/english-assist/test-build-english-ranking.py
          python tools/english-assist/build-english-ranking.py --check

      # Candidate ranking, first-page quality and spelling recovery.
      - name: English engine tests
        run: cargo test --locked -p retype-english -p retype-engine
